apiVersion: apps/v1
kind: Deployment
metadata:
  name: evote-web
  namespace: fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evote-web
  template:
    metadata:
      labels:
        app: evote-web
    spec:
      containers:
      - name: web
        image: pulsanolimit/evote-web:latest
        ports:
        - containerPort: 80
			env:
        - name: APP_BASE_URL
          value: "http://23.80.82.143:30080/"
        - name: APP_TIMEZONE
          value: "Asia/Jakarta"
        - name: DB_HOST
          value: "evote-db.database.svc.cluster.local"
        - name: DB_NAME
          value: "db_pilketos"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: "Kubernete$2027"
---
apiVersion: v1
kind: Service
metadata:
  name: evote-web
  namespace: fe
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
  selector:
    app: evote-web
